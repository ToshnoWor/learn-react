name: Refresh npm lockfile

on:
  push:
    branches:
      - modernize/vite-security-cleanup
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate npm lockfile"
          git push origin HEAD:$GITHUB_REF_NAME
